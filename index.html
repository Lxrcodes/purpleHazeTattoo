<!DOCTYPE html>
<html lang="en" class="scroll-smooth overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purple Haze Tattoos | Illustrative & Fine Line Tattoos in Perth</title>
  <meta name="description" content="Perth tattoo artist specializing in illustrative blackwork, fine line, and pop culture tattoos. View the portfolio and book your custom piece.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@400;500;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Preload critical images -->
  <link rel="preload" as="image" href="img/james-lee-PCAf6sWh7No-unsplash.jpg">
  <link rel="preload" as="image" href="img/4a030e751936cf88fdca781ca19a1605.jpeg">
  <link rel="preload" as="image" href="img/IMG_2413.jpeg">

  <style>
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #1a1a2e; }
    ::-webkit-scrollbar-thumb { background: #9d4edd; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #c77dff; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-montserrat { font-family: 'Montserrat', sans-serif; }
    .font-garamond { font-family: 'Cormorant Garamond', serif; }

    /* Base scroll animations */
    .scroll-reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .scroll-reveal.visible { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }

    /* Fade from left */
    .fade-left {
      opacity: 0;
      transform: translateX(-60px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .fade-left.visible { opacity: 1; transform: translateX(0); }

    /* Fade from right */
    .fade-right {
      opacity: 0;
      transform: translateX(60px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .fade-right.visible { opacity: 1; transform: translateX(0); }

    /* Zoom in */
    .zoom-in {
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .zoom-in.visible { opacity: 1; transform: scale(1); }

    /* Flip in */
    .flip-in {
      opacity: 0;
      transform: perspective(1000px) rotateY(-30deg);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .flip-in.visible { opacity: 1; transform: perspective(1000px) rotateY(0); }

    /* Stagger delays */
    .delay-100 { transition-delay: 0.1s; }
    .delay-200 { transition-delay: 0.2s; }
    .delay-300 { transition-delay: 0.3s; }
    .delay-400 { transition-delay: 0.4s; }
    .delay-500 { transition-delay: 0.5s; }

    /* Parallax-style floating animation */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .float { animation: float 4s ease-in-out infinite; }

    /* Glow pulse for accent elements */
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(147, 51, 234, 0.3); }
      50% { box-shadow: 0 0 40px rgba(147, 51, 234, 0.6); }
    }
    .glow-pulse { animation: glow-pulse 3s ease-in-out infinite; }

    /* Image reveal effect */
    .img-reveal {
      position: relative;
      overflow: hidden;
    }
    .img-reveal::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #9d4edd 0%, #1a1a2e 100%);
      transform: scaleX(1);
      transform-origin: right;
      transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1);
    }
    .img-reveal.visible::after {
      transform: scaleX(0);
    }

    /* Text shimmer effect for headings */
    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    .shimmer-text {
      background: linear-gradient(90deg, #a855f7 0%, #ec4899 25%, #a855f7 50%, #ec4899 75%, #a855f7 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 4s linear infinite;
    }
  </style>
</head>
<body class="bg-[#1a1a2e] text-slate-300 font-montserrat overflow-x-hidden">
  <app-root></app-root>
</body>
</html>
